<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DENR - Seed Inventory & Management System</title>
  
  <!-- Fonts & Core Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/pages/components.css" />
  <link rel="stylesheet" href="/styles/pages/auth.css" />
  <link rel="stylesheet" href="/styles/pages/admin.css" />
  <link rel="stylesheet" href="/styles/pages/personnel.css" />
</head>
<body>

  <!-- App Header / Top Navigation Bar -->
  <header id="app-header" class="app-header hidden">
    <!-- Rendered dynamically by header.component.js -->
  </header>

  <!-- Dynamic Page View Container -->
  <main id="app-root" class="app-root">
    <div id="app-loader" class="app-loader">
      <div class="spinner"></div>
      <p>Loading DENR System...</p>
    </div>
  </main>

  <!-- Shared Component Mount Points -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container"></div>

  <!-- Main JavaScript Entry -->
  <script type="module" src="/main.js"></script>
</body>
</html>
